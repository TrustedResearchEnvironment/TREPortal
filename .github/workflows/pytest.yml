name: Run Pytest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ODBC Driver 17 for SQL Server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | \
            gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-archive-keyring.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] \
            https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | \
            sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc unixodbc-dev
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql17

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          python3 -m pytest -v --tb=short --junitxml=pytest-results.xml 2>&1 | tee pytest-output.txt

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 Pytest Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f pytest-results.xml ]; then
            # Extract test counts from JUnit XML
            TESTS=$(grep -oP 'tests="\K[0-9]+' pytest-results.xml | head -1)
            FAILURES=$(grep -oP 'failures="\K[0-9]+' pytest-results.xml | head -1)
            ERRORS=$(grep -oP 'errors="\K[0-9]+' pytest-results.xml | head -1)
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' pytest-results.xml | head -1)
            
            PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))
            
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚠️ Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Total | $TESTS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test results file found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f pytest-output.txt ]; then
            tail -50 pytest-output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo 'pytest-output.txt not found; see earlier logs for details.' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            pytest-output.txt
          retention-days: 30
          if-no-files-found: warn
