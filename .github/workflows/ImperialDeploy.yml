# Generated by Copilot
name: Imperial Build and Push



on:
  push:
    branches: [ "ImperialDeploy" ]
  workflow_dispatch:
  # pull_request:
  #   branches: [ "ImperialDeploy" ]

jobs:
  # environment: ImperialDeploy
  
  build:

    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      GITHUB_SHA: ${{ github.sha }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Environment setup
      run: |
        echo "Branch: ${{ github.ref_name }}"
        echo "vars.ENVIRONMENT: ${{ vars.ENVIRONMENT }}"
        env | sort

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        #   push if not a pull request 
        push: ${{ github.event_name != 'pull_request' }}        
        tags: ghcr.io/trustedresearchenvironment/trustapi:${{ github.ref_name }}
