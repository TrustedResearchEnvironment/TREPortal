name: treportal

services:
  app:
    build: .
    env_file:
      - .env
    environment:
      SQLDB_CONNECTION_STRING: ${SQLDB_CONNECTION_STRING:?export SQLDB_CONNECTION_STRING in your shell}
      API_KEY: ${API_KEY:?set API_KEY in .env}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID in .env}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?set ENTRA_CLIENT_ID in .env}
    ports:
      - "8080:80"
    restart: unless-stopped
    # curl is not in the runtime image, so probe with Python. Goes through nginx to /api/health.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
