<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="MyRequests.css">
</head>
<body class="bg-light">

<div id="toast-container"></div>

<div class="container-fluid py-4">
    <div class="card shadow-sm">

        <!-- ── Card Header: Title + Tabs ── -->
        <div class="card-header border-bottom-0 pt-4 pb-0 px-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0 fw-bold">My Requests</h4>
                <button id="refresh-btn" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    Refresh
                </button>
            </div>

            <!-- Top Nav Tabs -->
            <ul class="nav nav-tabs border-0" id="requestTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="access-tab" data-bs-toggle="tab"
                            data-bs-target="#access-pane" type="button" role="tab">
                        Data Access
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="import-tab" data-bs-toggle="tab"
                            data-bs-target="#import-pane" type="button" role="tab">
                        Data Import
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="export-tab" data-bs-toggle="tab"
                            data-bs-target="#export-pane" type="button" role="tab">
                        Data Export
                    </button>
                </li>
            </ul>
        </div>

        <div class="card-body px-4 pt-4">
            <div class="tab-content" id="requestTabsContent">

                <!-- ════════════════════════════════════════
                     ACCESS TAB
                ════════════════════════════════════════ -->
                <div class="tab-pane fade show active" id="access-pane" role="tabpanel">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                        <div id="access-chips" class="d-flex flex-wrap gap-2">
                            <button class="req-chip active" data-status="Pending Approval">Pending Approval <span class="chip-count"></span></button>
                            <button class="req-chip" data-status="Approved">Approved <span class="chip-count"></span></button>
                            <button class="req-chip" data-status="Rejected">Rejected <span class="chip-count"></span></button>
                            <button class="req-chip" data-status="Finalised">Finalised <span class="chip-count"></span></button>
                        </div>
                        <input id="access-search" type="text" class="form-control form-control-sm" style="max-width:240px" placeholder="Search requests…">
                    </div>
                    <div id="access-table-area" class="mb-3"></div>
                    <div id="access-pagination" class="d-flex justify-content-center align-items-center gap-2 mt-3"></div>
                </div>

                <!-- ════════════════════════════════════════
                     IMPORT TAB
                ════════════════════════════════════════ -->
                <div class="tab-pane fade" id="import-pane" role="tabpanel">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                        <div id="import-chips" class="d-flex flex-wrap gap-2">
                            <button class="req-chip active" data-status="Awaiting Submission">Awaiting Submission <span class="chip-count"></span></button>
                            <button class="req-chip" data-status="Pending Approval">Pending Approval <span class="chip-count"></span></button>
                            <button class="req-chip" data-status="Approved">Approved <span class="chip-count"></span></button>
                            <button class="req-chip" data-status="Rejected">Rejected <span class="chip-count"></span></button>
                            <button class="req-chip" data-status="Finalised">Finalised <span class="chip-count"></span></button>
                        </div>
                        <div class="d-flex gap-2 align-items-center">
                            <input id="import-search" type="text" class="form-control form-control-sm" style="max-width:220px" placeholder="Search imports…">
                            <button class="btn btn-primary btn-sm text-nowrap" data-bs-toggle="modal" data-bs-target="#importModal">
                                + New Import Request
                            </button>
                        </div>
                    </div>
                    <div id="import-table-area" class="mb-3"></div>
                    <div id="import-pagination" class="d-flex justify-content-center align-items-center gap-2 mt-3"></div>
                </div>

                <!-- ════════════════════════════════════════
                     EXPORT TAB
                ════════════════════════════════════════ -->
                <div class="tab-pane fade" id="export-pane" role="tabpanel">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                        <div id="export-chips" class="d-flex flex-wrap gap-2">
                            <button class="req-chip active" data-status="Awaiting Submission">Awaiting Submission <span class="chip-count"></span></button>
                            <button class="req-chip" data-status="Pending Approval">Pending Approval <span class="chip-count"></span></button>
                            <button class="req-chip" data-status="Approved">Approved <span class="chip-count"></span></button>
                            <button class="req-chip" data-status="Rejected">Rejected <span class="chip-count"></span></button>
                            <button class="req-chip" data-status="Finalised">Finalised <span class="chip-count"></span></button>
                        </div>
                        <div class="d-flex gap-2 align-items-center">
                            <input id="export-search" type="text" class="form-control form-control-sm" style="max-width:220px" placeholder="Search exports…">
                            <button class="btn btn-primary btn-sm text-nowrap" data-bs-toggle="modal" data-bs-target="#exportModal">
                                + New Export Request
                            </button>
                        </div>
                    </div>
                    <div id="export-table-area" class="mb-3"></div>
                    <div id="export-pagination" class="d-flex justify-content-center align-items-center gap-2 mt-3"></div>
                </div>

            </div><!-- /tab-content -->
        </div><!-- /card-body -->
    </div><!-- /card -->
</div>

<!-- ════════════════════════════════════════════════════════════
     DELETE MODAL — Access Requests
════════════════════════════════════════════════════════════ -->
<div class="modal fade" id="deleteAccessModal" tabindex="-1" aria-labelledby="deleteAccessModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteAccessModalLabel">Delete Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="deleteAccessModalBody"></div>
        </div>
    </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     IMPORT REQUEST MODAL
════════════════════════════════════════════════════════════ -->
<div class="modal fade" id="importModal" tabindex="-1" aria-labelledby="importModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="importModalLabel">New Import Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="import-request-name" class="form-label fw-medium">Import Request Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="import-request-name" placeholder="Enter a name for this request">
                </div>
                <div class="mb-1">
                    <label for="import-project-select" class="form-label fw-medium">Source Assist Project <span class="text-danger">*</span></label>
                    <select class="form-select" id="import-project-select">
                        <option value="">Loading…</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="import-submit-btn" disabled>Submit Request</button>
            </div>
        </div>
    </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     EXPORT REQUEST MODAL
════════════════════════════════════════════════════════════ -->
<div class="modal fade" id="exportModal" tabindex="-1" aria-labelledby="exportModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exportModalLabel">New Export Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="export-request-name" class="form-label fw-medium">Export Request Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="export-request-name" placeholder="Enter a name for this request">
                </div>
                <div class="mb-1">
                    <label for="export-project-select" class="form-label fw-medium">Source Assist Project <span class="text-danger">*</span></label>
                    <select class="form-select" id="export-project-select">
                        <option value="">Loading…</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="export-submit-btn" disabled>Submit Request</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="MyRequests.js"></script>
</body>
</html>
