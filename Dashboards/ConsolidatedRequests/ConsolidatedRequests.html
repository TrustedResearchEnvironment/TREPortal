<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="ConsolidatedRequests.css">
</head>
<body>
    <div id="webcrumbs">
        <div class="bg-gray-50 min-h-screen p-6">
            <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
                <!-- Header -->
                <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-black">My Requests</h1>
                    <div class="flex items-center gap-2">
                        <button id="new-request-btn" class="bg-[#4ec4bc] text-white px-4 py-2 rounded-lg hover:bg-[#3da59d] transition-colors hidden">
                        </button>
                        <button id="refresh-data-btn" class="btn btn-outline-primary" title="Refresh data">↻</button>
                    </div>
                </div>

                <!-- Type Tab Bar -->
                <div id="type-tab-bar" class="flex border-b border-gray-200">
                    <button class="type-tab active" data-type="export">Data Export Requests</button>
                    <button class="type-tab" data-type="import">Data Import Requests</button>
                    <button class="type-tab" data-type="dataaccess">Data Access Requests</button>
                </div>

                <div class="p-6">
                    <!-- Status Chips + Search -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4">
                        <div id="status-chips-container" class="chip-container mb-4">
                        </div>
                        <div class="flex items-center mt-3 md:mt-0 gap-2">
                            <div class="relative">
                                <input id="search-input" type="text" placeholder="Search..." class="px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#4ec4bc] focus:border-[#4ec4bc]" />
                            </div>
                        </div>
                    </div>

                    <!-- Table Area -->
                    <div id="jobs-table-area">
                    </div>

                    <!-- Pagination -->
                    <div id="pagination-controls" class="flex justify-between items-center mt-4 px-2">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Single Modal for Export/Import -->
    <div id="request-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="text-xl font-semibold">New Request</h2>
                <button id="modal-close-btn" class="text-gray-500 hover:text-gray-800">&times;</button>
            </div>
            <form id="request-form">
                <div class="mb-4">
                    <label id="request-name-label" for="request-name-input" class="block text-sm font-medium text-gray-700 mb-2">Request Name</label>
                    <input id="request-name-input" type="text" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-[#4ec4bc] focus:border-[#4ec4bc]" placeholder="Enter a name for this request" required>
                </div>
                <div class="mb-4">
                    <label id="dropdown-label" for="request-dropdown" class="block text-sm font-medium text-gray-700 mb-2">Assist Project</label>
                    <select id="request-dropdown" name="request-dropdown" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-[#4ec4bc] focus:border-[#4ec4bc]">
                        <option value="">Select Assist Project...</option>
                    </select>
                </div>
                <div class="flex justify-end">
                    <button type="submit" id="modal-submit-btn" class="bg-[#4ec4bc] text-white px-4 py-2 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed hover:bg-[#3da59d]" disabled>
                        Submit Request
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-top-right"></div>

    <script src="ConsolidatedRequests.js"></script>
</body>
</html>
