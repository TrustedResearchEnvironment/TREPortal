# Generated by Copilot
name: Dev Build and Push

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:

  build:
    # use branch name for environment
    environment:
      name: ${{ github.ref_name }}

    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      GITHUB_SHA: ${{ github.sha }}
      CUSTOM_APP_NAME: ${{vars.CUSTOM_APP_NAME}}
      EMBEDDING_URL_DB: ${{vars.EMBEDDING_URL_DB}}
      EMBEDDING_URL_REDCap: ${{vars.EMBEDDING_URL_REDCap}}
      EMBEDDING_URL_Folder: ${{vars.EMBEDDING_URL_Folder}}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v3

    # - name: Check environment match
    #   run: |
    #     # only run if github.ref_name matches environment name
    #     if [[ "${{ github.ref_name }}" == "${{ vars.ENVIRONMENT }}" ]]; then
    #       echo "Environment matched: ${{ github.ref_name }}"
    #     else
    #       echo "Environment did not match: ${{ github.ref_name }}"
    #       exit 1
    #     fi

    - name: Environment setup
      run: |
        echo "Branch: ${{ github.ref_name }}"
        echo "vars.ENVIRONMENT: ${{ vars.ENVIRONMENT }}"
        env | sort

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ghcr.io/trustedresearchenvironment/trustapi:${{ github.ref_name }}